name: workers

on:
  pull_request:
    paths:
      - "workers/**"
      - ".github/workflows/workers.yml"
  push:
    branches:
      - main
      - dev
    paths:
      - "workers/**"
      - ".github/workflows/workers.yml"

permissions:
  contents: read

concurrency:
  group: workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: workers/package.json
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: workers/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build (wrangler dry run)
        run: pnpm build
